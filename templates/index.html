<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scopevision Screener</title>
<style>
  :root {
    --text: #eef1ff;
    --muted: #a9b1d6;
    --glass: rgba(255,255,255,0.07);
    --glass-border: rgba(255,255,255,0.14);
    --bull: #34e39b;
    --bear: #ff6b7d;
    --watch: #ffc857;
    --accent: #7c9cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
    background: #0a0d1f;
    padding: 28px 16px 70px;
    position: relative;
    overflow-x: hidden;
  }
  body::before, body::after, .blob {
    content: "";
    position: fixed;
    z-index: 0;
    border-radius: 50%;
    pointer-events: none;
  }
  body::before { width: 520px; height: 520px; background: #5b3df5; top: -140px; left: -120px; filter: blur(95px); opacity: .55; }
  body::after { width: 560px; height: 560px; background: #00c2ff; bottom: -180px; right: -140px; filter: blur(100px); opacity: .35; }
  .blob { width: 420px; height: 420px; background: #ff4fa3; top: 38%; left: 55%; filter: blur(110px); opacity: .28; }

  .wrap { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; }
  .glass {
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }

  header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px; margin-bottom: 18px;
  }
  h1 {
    margin: 0; font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em;
    background: linear-gradient(90deg, #ffffff, #9fb4ff 55%, #7be7ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .header-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .updated { color: var(--muted); font-size: .85rem; }
  .fib-link {
    color: var(--muted); text-decoration: none; font-size: .85rem;
    padding: 6px 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-border);
  }
  .fib-link:hover { color: #fff; border-color: rgba(255,255,255,.4); }

  .market {
    display: none; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 18px; margin-bottom: 16px; font-size: .92rem;
  }
  .muted { color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.up { background: var(--bull); box-shadow: 0 0 10px var(--bull); }
  .dot.down { background: var(--bear); box-shadow: 0 0 10px var(--bear); }
  .dot.mixed { background: var(--watch); box-shadow: 0 0 10px var(--watch); }

  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .sum-card { padding: 16px 18px; cursor: pointer; transition: transform .15s, border-color .15s; }
  .sum-card:hover { transform: translateY(-2px); }
  .sum-card.active { border-color: rgba(255,255,255,.55); }
  .sum-card .num { font-size: 1.9rem; font-weight: 700; line-height: 1.1; }
  .sum-card .lbl { color: var(--muted); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; }
  .sum-card.buy .num { color: var(--bull); }
  .sum-card.sell .num { color: var(--bear); }
  .sum-card.watch .num { color: var(--watch); }

  .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 8px 16px; border-radius: 999px; cursor: pointer; font-size: .85rem; font-weight: 600;
    color: var(--muted); background: var(--glass); border: 1px solid var(--glass-border);
  }
  .chip.active { color: #0a0d1f; background: #fff; border-color: #fff; }
  .search {
    flex: 1; min-width: 200px; padding: 10px 16px; border-radius: 999px; font-size: .92rem;
    color: var(--text); background: var(--glass); border: 1px solid var(--glass-border);
  }
  .search::placeholder { color: var(--muted); }
  .search:focus { outline: none; border-color: var(--accent); }
  .sort-sel {
    display: none; padding: 10px 14px; border-radius: 999px; font-size: .88rem;
    color: var(--text); background: var(--glass); border: 1px solid var(--glass-border);
  }
  .sort-sel option { color: #111; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .86rem; min-width: 1080px; }
  thead th {
    text-align: right; padding: 14px 12px; font-weight: 600; color: var(--muted);
    cursor: pointer; user-select: none; white-space: nowrap; font-size: .78rem;
    letter-spacing: .05em; text-transform: uppercase; border-bottom: 1px solid var(--glass-border);
  }
  thead th:first-child, thead th.left { text-align: left; }
  thead th:hover { color: #fff; }
  tbody td {
    padding: 12px; text-align: right; white-space: nowrap;
    border-bottom: 1px solid rgba(255,255,255,0.06); font-variant-numeric: tabular-nums;
  }
  tbody td:first-child, td.left { text-align: left; }
  tbody tr:hover { background: rgba(255,255,255,0.05); }
  .sym { font-weight: 700; color: #fff; }

  .badge { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: .75rem; font-weight: 700; }
  .badge.BUY { background: rgba(52,227,155,.16); color: var(--bull); border: 1px solid rgba(52,227,155,.35); }
  .badge.SELL { background: rgba(255,107,125,.16); color: var(--bear); border: 1px solid rgba(255,107,125,.35); }
  .badge.WATCH { background: rgba(255,200,87,.16); color: var(--watch); border: 1px solid rgba(255,200,87,.35); }

  .tag { display: inline-block; padding: 2px 9px; border-radius: 6px; font-size: .75rem; font-weight: 600; }
  .tag.up { background: rgba(52,227,155,.14); color: var(--bull); }
  .tag.down { background: rgba(255,107,125,.14); color: var(--bear); }
  .tag.mixed { background: rgba(255,200,87,.14); color: var(--watch); }
  .tag.warn { background: rgba(255,200,87,.14); color: var(--watch); }
  .hot { color: #7be7ff; font-weight: 700; }
  .good { color: var(--bull); font-weight: 700; }

  .cards { display: none; grid-template-columns: 1fr; gap: 12px; }
  .card { padding: 16px; }
  .card-top { display: flex; justify-content: space-between; align-items: center; }
  .card .sym { font-size: 1.1rem; }
  .card-ltp { margin: 6px 0 12px; font-size: 1.35rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .grid small { display: block; color: var(--muted); font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; }
  .grid div { font-variant-numeric: tabular-nums; font-size: .92rem; }
  .card-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .cchip { padding: 3px 10px; border-radius: 999px; font-size: .75rem; background: rgba(255,255,255,.08); }

  .empty { text-align: center; color: var(--muted); padding: 50px 0; display: none; }

  @media (max-width: 760px) {
    body { padding: 18px 12px 60px; }
    h1 { font-size: 1.4rem; }
    .summary { grid-template-columns: repeat(2, 1fr); }
    .table-wrap { display: none; }
    .cards { display: grid; }
    .sort-sel { display: block; }
  }
</style>
</head>
<body>
<div style="text-align:center; padding:10px 0;">
  <img src="/static/logo.png" alt="Logo" style="max-height:70px; width:auto;">
</div>

<div id="disclaimer-bar" onclick="var d=document.getElementById('disclaimer-text'); d.style.display=(d.style.display==='block')?'none':'block';" style="position:sticky; top:6px; right:8px; float:right; z-index:9999; background:transparent; color:#b00000; width:56px; height:56px; line-height:56px; text-align:center; font-size:36px; cursor:pointer;" title="Disclaimer (click to view)">
  ⚠️
</div>
<div id="disclaimer-text" style="display:none; background:#b00000; color:#ffffff; text-align:center; padding:8px 14px; font-size:11px; font-weight:bold;">
  This information is for personal / educational use only. It is NOT a buy or sell recommendation. Trading involves risk — consult a SEBI-registered advisor before making decisions.
</div>

<div class="blob"></div>
<div class="wrap">
  <header>
    <h1>Scopevision Screener</h1>
    <div class="header-right">
      <a class="fib-link" href="/fib">📐 Levels Check Karo</a>
      <span class="updated" id="updated"></span>
    </div>
  </header>

  <div class="market glass" id="market"></div>

  <div class="summary" id="summary"></div>

  <div class="toolbar">
    <div class="chips" id="chips">
      <button class="chip active" data-f="ALL">All</button>
      <button class="chip" data-f="BUY">BUY</button>
      <button class="chip" data-f="SELL">SELL</button>
      <button class="chip" data-f="WATCH">WATCH</button>
    </div>
    <input class="search" id="search" placeholder="Symbol search karo (e.g. RELIANCE)">
    <select class="sort-sel" id="sortSel">
      <option value="symbol">Sort: Symbol</option>
      <option value="signal">Sort: Signal</option>
      <option value="rr">Sort: R:R</option>
      <option value="vol_ratio">Sort: Vol x</option>
      <option value="ltp">Sort: LTP</option>
    </select>
  </div>

  <div class="table-wrap glass">
    <table>
      <thead><tr id="thead-row"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="cards" id="cards"></div>
  <p class="empty" id="empty">Kai stock na male</p>
</div>

<script>
  const stocks = {{ stocks | tojson }};
  const market = {{ market | tojson }};
  const lastUpdated = "{{ last_updated }}";

  const COLS = [
    { key: "symbol", label: "Symbol" },
    { key: "ltp", label: "LTP" },
    { key: "poc", label: "Point" },
    { key: "vah", label: "VHIGH" },
    { key: "val", label: "VLOW" },
    { key: "signal", label: "Signal", left: true },
    { key: "short_target", label: "Short Target" },
    { key: "long_target", label: "Long Target" },
    { key: "stop_loss", label: "SL" },
    { key: "trend", label: "Trend" },
    { key: "vol_ratio", label: "Vol x" },
    { key: "rr", label: "R:R" },
    { key: "liquidity", label: "Liq" },
    { key: "corp_action", label: "Check" }
  ];

  let sortKey = "symbol", sortDir = 1, filter = "ALL";

  // ---------- helpers ----------
  function fmt(v) { return (v === null || v === undefined) ? "—" : v; }

  function sigOf(s) {
    const t = s.signal || "";
    if (t.includes("WATCH")) return "WATCH";
    if (t.includes("BUY")) return "BUY";
    return "SELL";
  }

  function badge(sg) { return `<span class="badge ${sg}">${sg}</span>`; }

  function trendTag(t) {
    if (!t || t === "NA") return `<span class="muted">—</span>`;
    const c = t === "Up" ? "up" : (t === "Down" ? "down" : "mixed");
    const arrow = t === "Up" ? "▲ " : (t === "Down" ? "▼ " : "◆ ");
    return `<span class="tag ${c}">${arrow}${t}</span>`;
  }

  function volCell(v) {
    if (v === null || v === undefined) return "—";
    return `<span class="${v >= 1.5 ? "hot" : ""}">${v}x</span>`;
  }

  function rrCell(r) {
    if (r === null || r === undefined) return "—";
    return `<span class="${r >= 2 ? "good" : ""}">${r}</span>`;
  }

  function liqCell(l) {
    if (l === "Low") return `<span class="tag warn">Low</span>`;
    return l ? l : "—";
  }

  function checkCell(c) { return c ? `<span class="tag down">Check</span>` : ""; }

  function cmp(a, b) {
    let av = a[sortKey], bv = b[sortKey];
    if (sortKey === "signal") { av = sigOf(a); bv = sigOf(b); }
    const an = (av === null || av === undefined);
    const bn = (bv === null || bv === undefined);
    if (an && bn) return 0;
    if (an) return 1;
    if (bn) return -1;
    if (typeof av === "string") return sortDir * av.localeCompare(bv);
    return sortDir * (Number(av) - Number(bv));
  }

  // ---------- static parts ----------
  try {
    const d = new Date(lastUpdated.replace(/\.\d+/, ""));
    document.getElementById("updated").textContent = "Last updated: " +
      d.toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short", timeZone: "Asia/Kolkata" });
  } catch (e) {
    document.getElementById("updated").textContent = "Last updated: " + lastUpdated;
  }

  if (market) {
    const c = market.trend === "Up" ? "up" : (market.trend === "Down" ? "down" : "mixed");
    const el = document.getElementById("market");
    el.innerHTML = `<span class="dot ${c}"></span><b>Nifty 50</b>` +
      `<span class="tag ${c}">${market.trend}</span>` +
      `<span class="muted">Close ${market.close} &nbsp;·&nbsp; 200 DMA ${market.dma200}</span>`;
    el.style.display = "flex";
  }

  document.getElementById("thead-row").innerHTML = COLS.map(c =>
    `<th data-key="${c.key}" class="${c.left ? "left" : ""}">${c.label}</th>`).join("");

  function renderSummary() {
    const cnt = { BUY: 0, SELL: 0, WATCH: 0 };
    stocks.forEach(s => { cnt[sigOf(s)]++; });
    const items = [
      { f: "ALL", cls: "", num: stocks.length, lbl: "Total" },
      { f: "BUY", cls: "buy", num: cnt.BUY, lbl: "BUY" },
      { f: "SELL", cls: "sell", num: cnt.SELL, lbl: "SELL" },
      { f: "WATCH", cls: "watch", num: cnt.WATCH, lbl: "WATCH" }
    ];
    document.getElementById("summary").innerHTML = items.map(i =>
      `<div class="sum-card glass ${i.cls} ${filter === i.f ? "active" : ""}" data-f="${i.f}">` +
      `<div class="num">${i.num}</div><div class="lbl">${i.lbl}</div></div>`).join("");
    document.querySelectorAll(".sum-card").forEach(el =>
      el.addEventListener("click", () => setFilter(el.dataset.f)));
  }

  function setFilter(f) {
    filter = f;
    document.querySelectorAll("#chips .chip").forEach(c =>
      c.classList.toggle("active", c.dataset.f === f));
    render();
  }

  // ---------- main render ----------
  function render() {
    renderSummary();
    const q = document.getElementById("search").value.trim().toUpperCase();
    const rows = stocks
      .filter(s => s.symbol.includes(q) && (filter === "ALL" || sigOf(s) === filter))
      .sort(cmp);

    document.getElementById("empty").style.display = rows.length ? "none" : "block";

    document.getElementById("tbody").innerHTML = rows.map(s => `
      <tr>
        <td class="sym">${s.symbol}</td>
        <td>${fmt(s.ltp)}</td>
        <td>${fmt(s.poc)}</td>
        <td>${fmt(s.vah)}</td>
        <td>${fmt(s.val)}</td>
        <td class="left">${badge(sigOf(s))}</td>
        <td>${fmt(s.short_target)}</td>
        <td>${fmt(s.long_target)}</td>
        <td>${fmt(s.stop_loss)}</td>
        <td>${trendTag(s.trend)}</td>
        <td>${volCell(s.vol_ratio)}</td>
        <td>${rrCell(s.rr)}</td>
        <td>${liqCell(s.liquidity)}</td>
        <td>${checkCell(s.corp_action)}</td>
      </tr>`).join("");

    document.getElementById("cards").innerHTML = rows.map(s => `
      <div class="card glass">
        <div class="card-top"><span class="sym">${s.symbol}</span>${badge(sigOf(s))}</div>
        <div class="card-ltp">${fmt(s.ltp)} ${trendTag(s.trend)}</div>
        <div class="grid">
          <div><small>Point</small>${fmt(s.poc)}</div>
          <div><small>VHIGH</small>${fmt(s.vah)}</div>
          <div><small>VLOW</small>${fmt(s.val)}</div>
          <div><small>Short</small>${fmt(s.short_target)}</div>
          <div><small>Long</small>${fmt(s.long_target)}</div>
          <div><small>SL</small>${fmt(s.stop_loss)}</div>
        </div>
        <div class="card-chips">
          ${s.vol_ratio !== null && s.vol_ratio !== undefined ? `<span class="cchip">Vol ${s.vol_ratio}x</span>` : ""}
          ${s.rr !== null && s.rr !== undefined ? `<span class="cchip">R:R ${s.rr}</span>` : ""}
          ${s.liquidity === "Low" ? `<span class="tag warn">Low liquidity</span>` : ""}
          ${s.corp_action ? `<span class="tag down">Check split/bonus</span>` : ""}
        </div>
      </div>`).join("");
  }

  // ---------- events ----------
  document.querySelectorAll("#thead-row th").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      sortDir = (sortKey === key) ? -sortDir : 1;
      sortKey = key;
      render();
    });
  });

  document.querySelectorAll("#chips .chip").forEach(c =>
    c.addEventListener("click", () => setFilter(c.dataset.f)));

  document.getElementById("search").addEventListener("input", render);

  document.getElementById("sortSel").addEventListener("change", e => {
    sortKey = e.target.value;
    sortDir = (sortKey === "rr" || sortKey === "vol_ratio" || sortKey === "ltp") ? -1 : 1;
    render();
  });

  render();
</script>
</body>
</html>
