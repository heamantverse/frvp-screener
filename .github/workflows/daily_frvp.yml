name: Daily FRVP

on:
  schedule:
    - cron: "45 10 * * 1-5"      # 16:15 IST, Mon-Fri
  workflow_dispatch:
    inputs:
      dates:
        description: "Optional dates YYYY-MM-DD (comma separated). Empty = today"
        default: ""
      send_month:
        description: "Optional YYYY-MM -> send that month's file now"
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt openpyxl
      - run: python daily_frvp.py
        env:
          DATES: ${{ github.event.inputs.dates }}
          SEND_MONTH: ${{ github.event.inputs.send_month }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_REPO: heamantverse/scope-data
          # use the SAME token secret that your screener workflow uses to write to scope-data
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
