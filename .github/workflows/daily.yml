name: Daily FRVP Screener

on:
  schedule:
    - cron: '0 11 * * 1-5'   # Mon-Fri, 4:30 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          CAPITAL: ${{ secrets.CAPITAL }}
          RISK_PCT: ${{ secrets.RISK_PCT }}
        run: python screener_job.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add results.json
          git commit -m "Daily update" || echo "No changes"
          git push

      - name: Build PDF + Excel and send to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python make_pdf.py
          python make_excel.py

          curl -s -o /dev/null -w "PDF status: %{http_code}\n" \
            -F chat_id="$TG_CHAT" \
            -F document=@Screener_report.pdf \
            -F caption="Daily FRVP Screener Report" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendDocument"

          curl -s -o /dev/null -w "Excel status: %{http_code}\n" \
            -F chat_id="$TG_CHAT" \
            -F document=@Screener_report.xlsx \
            -F caption="Daily FRVP Screener Excel" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendDocument"
