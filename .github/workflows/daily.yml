name: Daily FRVP Screener

on:
  schedule:
    - cron: '0 11 * * 1-5'   # Mon-Fri, 4:30 PM IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python screener_job.py

      - name: Publish results to private repo
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          git clone "https://x-access-token:${DATA_REPO_TOKEN}@github.com/heamantverse/scope-data.git" data
          cp results.json data/results.json
          cd data
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add results.json
          git commit -m "Daily update" || echo "No changes"
          git push

      - name: Send PDF to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python make_pdf.py
          curl -s -o /dev/null -w "Telegram status: %{http_code}\n" \
            -F chat_id="$TG_CHAT" \
            -F document=@FRVP_report.pdf \
            -F caption="FRVP daily screener" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendDocument"
