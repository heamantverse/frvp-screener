name: Pre-market Index Alert

on:
  schedule:
    - cron: '30 3 * * 1-5'   # 9:00 AM IST, Mon-Fri
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: index-alert
  cancel-in-progress: false

jobs:
  index-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install smartapi-python pyotp logzero websocket-client requests reportlab pandas numpy

      - name: Wait for Telegram input (till 9:10) and run alert
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_DEADLINE_IST: "09:10"
        run: python nifty_banknifty_alert.py

      - name: Build PDF and send to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python make_index_alert_pdf.py
          curl -s -o /dev/null -w "PDF status: %{http_code}\n" \
            -F chat_id="$TG_CHAT" \
            -F document=@Index_Alert.pdf \
            -F caption="Pre-market Index Alert" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendDocument"
